<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>試作の見本</title>
<style>
  :root { --ink:#1c1c1c; --sub:#6b6b6b; --line:#d6d6d6; --accent:#1f5a4c; --bg:#fbfbf9; }
  * { box-sizing:border-box; }
  html, body { min-height:100%; margin:0; }
  body { min-height:100vh; min-height:100svh; background:var(--bg); color:var(--ink); display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Meiryo",sans-serif; padding:24px 16px; }
  main { width:100%; max-width:380px; }
  h1 { font-size:22px; line-height:1.5; margin:0 0 8px; letter-spacing:.02em; }
  p { font-size:14px; line-height:1.8; color:var(--sub); margin:0 0 20px; }
  label { display:block; font-size:13px; color:var(--sub); margin-bottom:6px; }
  input { width:100%; font-size:18px; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:#fff;
    color:var(--ink); letter-spacing:.06em; font-family:ui-monospace,Menlo,Consolas,monospace; }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent); }
  button { width:100%; margin-top:12px; font-size:16px; font-weight:700; padding:13px; border:0; border-radius:10px;
    background:var(--accent); color:#fff; cursor:pointer; }
  button[disabled] { opacity:.55; cursor:default; }
  #msg { min-height:1.8em; margin:12px 0 0; font-size:13px; color:#a23b2a; }
  small { display:block; margin-top:22px; font-size:12px; line-height:1.7; color:var(--sub); border-top:1px solid var(--line); padding-top:12px; }
</style>
</head>

<main>
  <h1>試作の見本</h1>
  <p>このページは、合言葉をお持ちの方だけがご覧になれます。</p>
  <form id="f" autocomplete="off">
    <label for="p">合言葉</label>
    <input id="p" type="text" inputmode="numeric" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="">
    <button id="b" type="submit">開く</button>
    <div id="msg" role="alert"></div>
  </form>
  <small>中身は暗号化されており、合言葉なしでは読めません。<br>画面の数字と名称は、すべて架空のものです。</small>
</main>

function b(x){ var r=atob(x), a=new Uint8Array(r.length); for(var k=0;k<r.length;k++) a[k]=r.charCodeAt(k); return a; }
function norm(x){ return (x||"").normalize("NFKC").trim().toLowerCase().replace(/[^a-z0-9]/g,""); }
var busy=false;
async function decryptWith(pass){
  var km = await crypto.subtle.importKey("raw", new TextEncoder().encode(norm(pass)), "PBKDF2", false, ["deriveKey"]);
  var key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(P.s), iterations:P.n, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  var pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(P.i)}, key, b(P.c));
  return new TextDecoder().decode(pt);
}
async function unlock(pass, quiet){
  var msg=document.getElementById("msg"), btn=document.getElementById("b");
  if(busy) return;
  if(!norm(pass)){ if(!quiet){ msg.style.color="#a23b2a"; msg.textContent="合言葉を入力してください。"; } return; }
  busy=true;
  btn.disabled=true; msg.style.color="#6b6b6b"; msg.textContent="開いています…";
  try{
    var html = await decryptWith(pass);
    try{ sessionStorage.setItem("k", norm(pass)); }catch(e){}
    try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
    document.open(); document.write(html); document.close();
  }catch(e){
    busy=false; btn.disabled=false; msg.style.color="#a23b2a";
    msg.textContent = (window.crypto && crypto.subtle) ? (quiet ? "" : "合言葉が違うようです。もう一度お確かめください。") : "このブラウザでは開けません。Safari か Chrome でお試しください。";
  }
}
document.getElementById("f").addEventListener("submit", function(ev){ ev.preventDefault(); unlock(document.getElementById("p").value, false); });
(function(){
  var m = /[#&]k=([^&]+)/.exec(location.hash), saved=null;
  try{ saved = sessionStorage.getItem("k"); }catch(e){}
  var hk=null; if(m){ try{ hk=decodeURIComponent(m[1]); }catch(e){ hk=m[1]; } }
  if(hk) unlock(hk, false); else if(saved) unlock(saved, true);
})();
